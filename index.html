
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JZ PLAY</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 18px 16px;
      background: #111;
      border-bottom: 1px solid #292929;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    .logo {
      color: #ff3030;
      font-size: 25px;
      font-weight: bold;
    }

    .subtitle {
      color: #aaa;
      font-size: 12px;
      margin-top: 5px;
    }

    main { padding: 16px; }

    h2 {
      font-size: 18px;
      margin: 4px 0 16px;
    }

    #search {
      width: 100%;
      padding: 12px;
      margin: 14px 0;
      border: 1px solid #333;
      border-radius: 8px;
      background: #171717;
      color: white;
      font-size: 14px;
    }

    /* AREA BANNER HORIZONTAL */
    .ad-container {
      width: 100%;
      margin: 8px 0;
      overflow: hidden;
      border-radius: 4px;
    }

    .ad-banner-placeholder {
      width: 100%;
      min-height: 48px;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #171717;
      border: 1px solid #303030;
      color: #888;
      text-align: center;
      font-size: 11px;
    }

    /* EMPAT SLOT IKLAN KOSONG */
    .empty-ad-slot {
      width: 100%;
      min-height: 20px;
      margin: 8px 0;
    }

    #videos {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .card {
      background: #171717;
      border: 1px solid #292929;
      border-radius: 10px;
      overflow: hidden;
      min-width: 0;
    }

    .inline-video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      background: #000;
    }

    .embed-cover {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: grid;
      place-items: center;
      background: #222;
      color: #ff3030;
      font-weight: bold;
      cursor: pointer;
    }

    .info { padding: 10px; }

    .title {
      font-size: 14px;
      line-height: 1.4;
      margin: 0 0 8px;
      overflow-wrap: anywhere;
    }

    .description {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 10px;
      overflow-wrap: anywhere;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    button, .download {
      display: block;
      width: 100%;
      padding: 10px;
      border: 0;
      border-radius: 6px;
      background: #f22;
      color: white;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      font-size: 13px;
    }

    .download { background: #333; }

    #status {
      color: #aaa;
      font-size: 14px;
      margin: 16px 0;
    }

    #pagination {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 7px;
      margin: 22px 0;
    }

    #pagination button {
      width: auto;
      min-width: 38px;
      background: #292929;
    }

    #pagination button.active { background: #f22; }

    #player {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 5;
      padding: 16px;
      overflow-y: auto;
    }

    .player-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    #playerTitle { font-size: 16px; }

    #closePlayer {
      width: auto;
      padding: 9px 14px;
    }

    #frame, #videoPlayer {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      background: #111;
    }

    #videoPlayer {
      display: none;
      object-fit: contain;
    }

    footer {
      color: #777;
      font-size: 12px;
      text-align: center;
      padding: 24px 12px;
    }

    @media (min-width: 700px) {
      #videos {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">JZ PLAY</div>
    <div class="subtitle">Tempat menonton video favoritmu</div>
  </header>

  <main>
    <h2>Video Terbaru</h2>

    <!-- BANNER ADSTERRA -->
    <div class="ad-container" id="banner-adsterra">
      <div class="ad-banner-placeholder">
        Area Banner Adsterra
      </div> <script async="async"
  data-cfasync="false"
  src="https://bancadeltempoidea.org/21/d97c13de15c560f017d5d95845aa3c2b">
</script>
<div id="container-d97c13de15c560f017d5d95845aa3c2b"></div>
    </div>

    <!-- BANNER MONETAG -->
    <div class="ad-container" id="banner-monetag">
      <div class="ad-banner-placeholder">
        Area Banner Monetag
      </div> <script
  src="https://quge5.com/88/tag.min.js"
  data-zone="305426"
  async
  data-cfasync="false">
      </script>
    </div>

    <!-- SLOT KOSONG POPUNDER -->
    <div class="empty-ad-slot" id="slot-popunder"></div>

    <!-- SLOT KOSONG POP-UP -->
    <div class="empty-ad-slot" id="slot-popup"></div>

    <!-- SLOT KOSONG MULTITAG -->
    <div class="empty-ad-slot" id="slot-multitag"></div>

    <!-- SLOT KOSONG SMARTLINK -->
    <div class="empty-ad-slot" id="slot-smartlink"></div>

    <input
      id="search"
      type="search"
      placeholder="Cari judul video..."
      autocomplete="off">

    <div id="status">Memuat daftar video...</div>
    <div id="videos"></div>
    <div id="pagination"></div>
  </main>

  <div id="player">
    <div class="player-top">
      <div id="playerTitle">Pemutar video</div>
      <button id="closePlayer" type="button">Tutup ✕</button>
    </div>

    <video id="videoPlayer" controls playsinline></video>

    <iframe
      id="frame"
      title="Pemutar video"
      allowfullscreen
      allow="autoplay; fullscreen; picture-in-picture"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </div>

  <footer>
    JZ PLAY · Video yang diunggah harus milikmu
    atau memiliki izin untuk ditayangkan.
  </footer>

  <script>
    const PROJECT_URL =
      "https://hinxtbzzavdnabtukaqw.supabase.co";

    const PUBLISHABLE_KEY =
      "sb_publishable_2HTAulFHCy0L7ix7NQvLKw_W0BnuTM-";

    const videosBox = document.getElementById("videos");
    const statusBox = document.getElementById("status");
    const pagination = document.getElementById("pagination");
    const searchInput = document.getElementById("search");
    const player = document.getElementById("player");
    const frame = document.getElementById("frame");
    const videoPlayer = document.getElementById("videoPlayer");

    const PER_PAGE = 8;

    let allVideos = [];
    let filteredVideos = [];
    let currentPage = 1;

    function isDirectVideo(url) {
      try {
        const pathname = new URL(url).pathname.toLowerCase();
        return /\.(mp4|webm|ogg|m4v)$/.test(pathname);
      } catch {
        return false;
      }
    }

    function openVideo(video) {
      let url;

      try {
        url = new URL(video.video_url);
      } catch {
        alert("Link video belum benar.");
        return;
      }

      if (url.protocol !== "https:") {
        alert("Link video harus menggunakan HTTPS.");
        return;
      }

      document.getElementById("playerTitle").textContent =
        video.title || "Video";

      if (isDirectVideo(url.href)) {
        frame.src = "about:blank";
        frame.style.display = "none";

        videoPlayer.style.display = "block";
        videoPlayer.src = url.href;
        videoPlayer.load();
      } else {
        videoPlayer.pause();
        videoPlayer.removeAttribute("src");
        videoPlayer.load();

        videoPlayer.style.display = "none";
        frame.style.display = "block";
        frame.src = url.href;
      }

      player.style.display = "block";
    }

    document.getElementById("closePlayer").onclick = () => {
      videoPlayer.pause();
      videoPlayer.removeAttribute("src");
      videoPlayer.load();

      frame.src = "about:blank";
      player.style.display = "none";
    };

    function renderVideos() {
      videosBox.replaceChildren();
      pagination.replaceChildren();

      if (!filteredVideos.length) {
        statusBox.textContent = "Video tidak ditemukan.";
        return;
      }

      statusBox.textContent =
        "Menampilkan " + filteredVideos.length + " video";

      const start = (currentPage - 1) * PER_PAGE;
      const pageVideos =
        filteredVideos.slice(start, start + PER_PAGE);

      pageVideos.forEach(video => {
        const card = document.createElement("article");
        card.className = "card";

        if (isDirectVideo(video.video_url || "")) {
          const inlineVideo = document.createElement("video");

          inlineVideo.className = "inline-video";
          inlineVideo.src = video.video_url;
          inlineVideo.controls = true;
          inlineVideo.preload = "metadata";
          inlineVideo.playsInline = true;

          card.appendChild(inlineVideo);
        } else {
          const embedCover = document.createElement("div");

          embedCover.className = "embed-cover";
          embedCover.textContent = "▶ JZ PLAY";
          embedCover.setAttribute("role", "button");
          embedCover.setAttribute("tabindex", "0");

          embedCover.onclick = () => openVideo(video);

          embedCover.onkeydown = event => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              openVideo(video);
            }
          };

          card.appendChild(embedCover);
        }

        const info = document.createElement("div");
        info.className = "info";

        const title = document.createElement("h3");
        title.className = "title";
        title.textContent = video.title || "Tanpa judul";

        const description = document.createElement("div");
        description.className = "description";
        description.textContent = video.description || "";

        const actions = document.createElement("div");
        actions.className = "actions";

        const watchButton = document.createElement("button");
        watchButton.type = "button";
        watchButton.textContent = "▶ Tonton";
        watchButton.onclick = () => openVideo(video);

        actions.appendChild(watchButton);

        if (video.download_url) {
          const download = document.createElement("a");

          download.className = "download";
          download.href = video.download_url;
          download.target = "_blank";
          download.rel = "noopener noreferrer";
          download.textContent = "⬇ Download";

          actions.appendChild(download);
        }

        info.append(title, description, actions);
        card.appendChild(info);
        videosBox.appendChild(card);
      });

      renderPagination();
    }

    function renderPagination() {
      const totalPages = Math.ceil(
        filteredVideos.length / PER_PAGE
      );

      if (totalPages <= 1) return;

      for (let page = 1; page <= totalPages; page++) {
        const button = document.createElement("button");

        button.type = "button";
        button.textContent = page;

        if (page === currentPage) {
          button.classList.add("active");
        }

        button.onclick = () => {
          currentPage = page;
          renderVideos();

          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });
        };

        pagination.appendChild(button);
      }
    }

    searchInput.addEventListener("input", () => {
      const keyword = searchInput.value
        .toLowerCase()
        .trim();

      filteredVideos = allVideos.filter(video =>
        (video.title || "").toLowerCase().includes(keyword)
      );

      currentPage = 1;
      renderVideos();
    });

    async function loadVideos() {
      try {
        const response = await fetch(
          PROJECT_URL +
          "/rest/v1/videos?select=id,title,description,thumbnail_url,video_url,download_url,created_at&order=created_at.desc",
          {
            headers: {
              apikey: PUBLISHABLE_KEY,
              Authorization: "Bearer " + PUBLISHABLE_KEY
            }
          }
        );

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        allVideos = await response.json();
        filteredVideos = [...allVideos];

        currentPage = 1;
        renderVideos();

        if (!allVideos.length) {
          statusBox.textContent =
            "Belum ada video. Tambahkan video melalui Supabase.";
        }

      } catch (error) {
        statusBox.textContent =
          "Gagal memuat video. Periksa publishable key dan pengaturan akses Supabase.";

        console.error(error);
      }
    }

    loadVideos();
  </script>

</body>
        </html>
