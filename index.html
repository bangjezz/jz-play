
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JZ PLAY</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 18px 16px;
      background: #111;
      border-bottom: 1px solid #292929;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .logo { color: #ff3030; font-size: 25px; font-weight: bold; }
    .subtitle { color: #aaa; font-size: 12px; margin-top: 5px; }
    main { padding: 16px; }
    h2 { font-size: 18px; margin: 4px 0 16px; }
    #videos {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .card {
      background: #171717;
      border: 1px solid #292929;
      border-radius: 10px;
      overflow: hidden;
    }
    .poster {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      display: block;
      background: #222;
    }
    .info { padding: 10px; }
    .title {
      font-size: 14px;
      line-height: 1.4;
      margin: 0 0 8px;
      overflow-wrap: anywhere;
    }
    .description {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      padding: 10px;
      border: 0;
      border-radius: 6px;
      background: #f22;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    #status { color: #aaa; font-size: 14px; margin: 16px 0; }
    #player {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 5;
      padding: 16px;
    }
    .player-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    #playerTitle { font-size: 16px; }
    #closePlayer { width: auto; padding: 9px 14px; }
    #frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      background: #111;
    }
    footer {
      color: #777;
      font-size: 12px;
      text-align: center;
      padding: 24px 12px;
    }
    @media (min-width: 700px) {
      #videos { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    .ad-container {
  width: 100%;
  min-height: 100px;
  margin: 16px 0;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
        }
  </style>
</head>
<body>
  <header>
    <div class="logo">JZ PLAY</div>
    <div class="subtitle">Tempat menonton video favoritmu</div>
  </header>

  <main>
    <h2>Video Terbaru</h2>
    <div class="ad-container">
  <script async="async"
    data-cfasync="false"
    src="https://bancadeltempoidea.org/21/d97c13de15c560f017d5d95845aa3c2b">
  </script>
  <div id="container-d97c13de15c560f017d5d95845aa3c2b"></div>
    </div>
    <div id="status">Memuat daftar video...</div>
    <div id="videos"></div>
  </main>

  <div id="player">
    <div class="player-top">
      <div id="playerTitle">Pemutar video</div>
      <button id="closePlayer" type="button">Tutup ✕</button>
    </div>
    <iframe id="frame" allowfullscreen
      allow="autoplay; fullscreen; picture-in-picture"
      referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </div>

  <footer>JZ PLAY · Video yang diunggah harus milikmu
    atau memiliki izin untuk ditayangkan.</footer>

  <script>
    const PROJECT_URL = "https://hinxtbzzavdnabtukaqw.supabase.co";

    // Masukkan Supabase publishable key milikmu di antara tanda kutip.
    // Jangan pernah memasukkan secret/service_role key ke website publik.
    const PUBLISHABLE_KEY = "sb_publishable_2HTAulFHCy0L7ix7NQvLKw_W0BnuTM-";

    const videosBox = document.getElementById("videos");
    const statusBox = document.getElementById("status");
    const player = document.getElementById("player");
    const frame = document.getElementById("frame");

    function openVideo(video) {
      let url;
      try {
        url = new URL(video.video_url);
      } catch {
        alert("Link video belum benar.");
        return;
      }

      if (url.protocol !== "https:") {
        alert("Link video harus menggunakan HTTPS.");
        return;
      }

      // Gunakan link embed dari penyedia video yang kamu gunakan.
      frame.src = url.href;
      document.getElementById("playerTitle").textContent = video.title || "Video";
      player.style.display = "block";
    }

    document.getElementById("closePlayer").onclick = () => {
      frame.src = "about:blank";
      player.style.display = "none";
    };

    async function loadVideos() {
      try {
        const response = await fetch(
          PROJECT_URL +
          "/rest/v1/videos?select=id,title,description,thumbnail_url,video_url,created_at&order=created_at.desc",
          {
            headers: {
              apikey: PUBLISHABLE_KEY,
              Authorization: "Bearer " + PUBLISHABLE_KEY
            }
          }
        );

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const videos = await response.json();
        videosBox.replaceChildren();

        if (!videos.length) {
          statusBox.textContent = "Belum ada video. Tambahkan video melalui Supabase.";
          return;
        }

        statusBox.textContent = "";

        videos.forEach(video => {
          const card = document.createElement("article");
          card.className = "card";

          if (video.thumbnail_url) {
            const img = document.createElement("img");
            img.className = "poster";
            img.src = video.thumbnail_url;
            img.alt = video.title || "Poster video";
            img.loading = "lazy";
            card.appendChild(img);
          } else {
            const placeholder = document.createElement("div");
            placeholder.className = "poster";
            placeholder.style.display = "grid";
            placeholder.style.placeItems = "center";
            placeholder.textContent = "JZ PLAY";
            card.appendChild(placeholder);
          }

          const info = document.createElement("div");
          info.className = "info";

          const title = document.createElement("h3");
          title.className = "title";
          title.textContent = video.title || "Tanpa judul";

          const description = document.createElement("div");
          description.className = "description";
          description.textContent = video.description || "";

          const button = document.createElement("button");
          button.type = "button";
          button.textContent = "▶ Tonton";
          button.onclick = () => openVideo(video);

          info.append(title, description, button);
          card.appendChild(info);
          videosBox.appendChild(card);
        });
      } catch (error) {
        statusBox.textContent =
          "Gagal memuat video. Periksa publishable key dan pengaturan akses Supabase.";
        console.error(error);
      }
    }

    loadVideos();
  </script>
</body>
  </html>
