
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JZ PLAY - Video Hiburan</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #080808;
  color: #fff;
  font-family: Arial, sans-serif;
}

header {
  background: #111;
  padding: 18px 16px;
  border-bottom: 1px solid #292929;
  position: sticky;
  top: 0;
  z-index: 10;
}

.header-inner {
  max-width: 1100px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 25px;
  font-weight: 900;
  color: #ff3030;
  letter-spacing: 1px;
}

.logo span {
  color: white;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 16px;
}

.banner {
  margin-bottom: 18px;
  text-align: center;
  overflow: hidden;
  border-radius: 10px;
}

.search-box {
  width: 100%;
  padding: 13px 15px;
  margin-bottom: 20px;
  background: #171717;
  border: 1px solid #333;
  border-radius: 9px;
  color: white;
  font-size: 15px;
  outline: none;
}

.search-box:focus {
  border-color: #ff3030;
}

.section-title {
  font-size: 19px;
  margin-bottom: 15px;
}

#videos {
  display: grid;
  grid-template-columns: 1fr;
  gap: 20px;
}

.video-card {
  background: #141414;
  border: 1px solid #292929;
  border-radius: 12px;
  overflow: hidden;
}

.video-title {
  font-size: 16px;
  font-weight: bold;
  padding: 13px 13px 8px;
  line-height: 1.4;
}

.video-description {
  color: #aaa;
  font-size: 13px;
  padding: 0 13px 12px;
  line-height: 1.5;
}

/* UKURAN VIDEO 4:5 */
.video-frame {
  width: 100%;
  aspect-ratio: 4 / 5;
  background: #000;
  overflow: hidden;
}

.inline-video,
.inline-embed {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
  object-fit: contain;
  background: #000;
}

.video-actions {
  display: flex;
  gap: 10px;
  padding: 12px;
}

.action-btn {
  flex: 1;
  text-align: center;
  padding: 12px 8px;
  background: #ff3030;
  color: white;
  text-decoration: none;
  border: 0;
  border-radius: 7px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

.download-btn {
  background: #252525;
  border: 1px solid #444;
}

.pagination {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin: 25px 0;
}

.page-btn {
  padding: 10px 14px;
  border: 1px solid #444;
  background: #171717;
  color: white;
  border-radius: 6px;
  cursor: pointer;
}

.page-btn.active {
  background: #ff3030;
  border-color: #ff3030;
}

.empty {
  text-align: center;
  color: #aaa;
  padding: 35px 10px;
}

footer {
  color: #777;
  text-align: center;
  padding: 25px 10px;
  font-size: 12px;
  border-top: 1px solid #222;
}

/* PEMUTAR VIDEO */
#player {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.97);
  z-index: 100;
  padding: 15px;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

#player.show {
  display: flex;
}

.player-top {
  width: 100%;
  max-width: 420px;
  display: flex;
  justify-content: flex-end;
  margin-bottom: 10px;
}

.close-player {
  background: #ff3030;
  border: 0;
  color: white;
  border-radius: 7px;
  padding: 10px 17px;
  font-weight: bold;
  cursor: pointer;
}

/* PEMUTAR 4:5 */
#playerContent {
  width: 100%;
  max-width: 420px;
  aspect-ratio: 4 / 5;
  background: #000;
}

#playerContent iframe,
#playerContent video {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
  background: #000;
}

@media (min-width: 750px) {
  #videos {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .video-frame {
    max-height: 600px;
  }
}
</style>

<!-- MONETAG BANNER -->
<script async src="https://quge5.com/88/tag.min.js"
data-zone="305426"></script>

</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">JZ <span>PLAY</span></div>
  </div>
</header>

<main>

  <!-- ADSTERRA BANNER -->
  <div class="banner">
    <div id="container-d97c13de15c560f017d5d95845aa3c2b"></div>
    <script async
    src="https://bancadeltempoidea.org/21/d97c13de15c560f017d5d95845aa3c2b">
    </script>
  </div>

  <input
    type="search"
    id="search"
    class="search-box"
    placeholder="Cari video..."
  >

  <h2 class="section-title">Video Terbaru</h2>

  <div id="videos">
    <div class="empty">Memuat video...</div>
  </div>

  <div id="pagination" class="pagination"></div>

</main>

<footer>
  © 2026 JZ PLAY. All Rights Reserved.
</footer>

<div id="player">
  <div class="player-top">
    <button class="close-player" onclick="closePlayer()">
      Tutup ✕
    </button>
  </div>

  <div id="playerContent"></div>
</div>

<script>
/* PENGATURAN SUPABASE */
const SUPABASE_URL =
  "https://hinxtbzzavdnabtukaqw.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_2HTAulFHCy0L7ix7NQvLKw_W0BnuTM-";

const TABLE = "videos";
const PER_PAGE = 8;

let allVideos = [];
let filteredVideos = [];
let currentPage = 1;


/* MENGAMBIL DATA VIDEO */
async function loadVideos() {
  const container = document.getElementById("videos");

  try {
    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/${TABLE}?select=*&order=created_at.desc`,
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (!response.ok) {
      throw new Error("Gagal mengambil data video");
    }

    allVideos = await response.json();
    filteredVideos = allVideos;

    renderVideos();

  } catch (error) {
    console.error(error);
    container.innerHTML =
      '<div class="empty">Video gagal dimuat. Periksa koneksi atau pengaturan Supabase.</div>';
  }
}


/* MEMERIKSA FORMAT VIDEO */
function isDirectVideo(url) {
  return /\.(mp4|webm|ogg|m4v)(\?.*)?$/i.test(url || "");
}


/* MENAMPILKAN VIDEO */
function renderVideos() {
  const container = document.getElementById("videos");
  const pagination = document.getElementById("pagination");

  container.innerHTML = "";
  pagination.innerHTML = "";

  const totalPages = Math.ceil(
    filteredVideos.length / PER_PAGE
  );

  if (!filteredVideos.length) {
    container.innerHTML =
      '<div class="empty">Video tidak ditemukan.</div>';
    return;
  }

  if (currentPage > totalPages) {
    currentPage = totalPages;
  }

  const start = (currentPage - 1) * PER_PAGE;

  const pageVideos = filteredVideos.slice(
    start,
    start + PER_PAGE
  );

  pageVideos.forEach(video => {
    const card = document.createElement("article");
    card.className = "video-card";

    const title = document.createElement("div");
    title.className = "video-title";
    title.textContent = video.title || "Video tanpa judul";

    const description = document.createElement("div");
    description.className = "video-description";
    description.textContent = video.description || "";

    const frame = document.createElement("div");
    frame.className = "video-frame";

    if (isDirectVideo(video.video_url)) {
      const videoElement = document.createElement("video");

      videoElement.className = "inline-video";
      videoElement.src = video.video_url;
      videoElement.controls = true;
      videoElement.playsInline = true;
      videoElement.preload = "metadata";

      frame.appendChild(videoElement);

    } else if (video.video_url) {
      const iframe = document.createElement("iframe");

      iframe.className = "inline-embed";
      iframe.src = video.video_url;
      iframe.loading = "lazy";
      iframe.allowFullscreen = true;
      iframe.setAttribute(
        "allow",
        "autoplay; fullscreen; picture-in-picture"
      );

      frame.appendChild(iframe);

    } else {
      frame.innerHTML =
        '<div class="empty">Video belum tersedia.</div>';
    }

    const actions = document.createElement("div");
    actions.className = "video-actions";

    const watchButton = document.createElement("button");
    watchButton.className = "action-btn";
    watchButton.textContent = "▶ Tonton";
    watchButton.onclick = () => openVideo(video);

    actions.appendChild(watchButton);

    if (video.download_url) {
      const downloadButton = document.createElement("a");

      downloadButton.className =
        "action-btn download-btn";

      downloadButton.textContent = "⬇ Download";
      downloadButton.href = video.download_url;
      downloadButton.target = "_blank";
      downloadButton.rel = "noopener noreferrer";

      actions.appendChild(downloadButton);
    }

    card.appendChild(title);

    if (video.description) {
      card.appendChild(description);
    }

    card.appendChild(frame);
    card.appendChild(actions);

    container.appendChild(card);
  });


  /* PAGINATION */
  for (let i = 1; i <= totalPages; i++) {
    const button = document.createElement("button");

    button.className =
      "page-btn" + (i === currentPage ? " active" : "");

    button.textContent = i;

    button.onclick = () => {
      currentPage = i;
      renderVideos();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    };

    pagination.appendChild(button);
  }
}


/* MEMBUKA PEMUTAR VIDEO */
function openVideo(video) {
  const player = document.getElementById("player");
  const content = document.getElementById("playerContent");

  content.innerHTML = "";

  if (isDirectVideo(video.video_url)) {
    const videoElement = document.createElement("video");

    videoElement.src = video.video_url;
    videoElement.controls = true;
    videoElement.autoplay = true;
    videoElement.playsInline = true;

    content.appendChild(videoElement);

  } else {
    const iframe = document.createElement("iframe");

    iframe.src = video.video_url;
    iframe.allowFullscreen = true;
    iframe.allow =
      "autoplay; fullscreen; picture-in-picture";

    content.appendChild(iframe);
  }

  player.classList.add("show");
}


/* MENUTUP PEMUTAR */
function closePlayer() {
  const player = document.getElementById("player");
  const content = document.getElementById("playerContent");

  player.classList.remove("show");
  content.innerHTML = "";
}


/* PENCARIAN */
document.getElementById("search")
.addEventListener("input", function() {

  const keyword = this.value.toLowerCase().trim();

  filteredVideos = allVideos.filter(video =>
    (video.title || "").toLowerCase().includes(keyword) ||
    (video.description || "").toLowerCase().includes(keyword)
  );

  currentPage = 1;
  renderVideos();
});


/* MULAI WEBSITE */
loadVideos();
</script>

</body>
</html>
