
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>JZ PLAY - Nonton Video</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #080808;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      background: #111;
      border-bottom: 1px solid #252525;
      padding: 17px 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-inner {
      max-width: 900px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #fff;
    }

    .logo span {
      color: #e50914;
    }

    .tagline {
      color: #999;
      font-size: 11px;
      margin-top: 3px;
    }

    main {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 16px;
    }

    .search-box {
      margin: 8px 0 18px;
    }

    .search-box input {
      width: 100%;
      background: #171717;
      color: white;
      border: 1px solid #333;
      border-radius: 9px;
      padding: 14px;
      font-size: 15px;
      outline: none;
    }

    .search-box input:focus {
      border-color: #e50914;
    }

    .section-title {
      font-size: 18px;
      margin: 18px 0 14px;
    }

    .ad-box {
      min-height: 60px;
      width: 100%;
      margin: 12px 0 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #videos {
      display: grid;
      grid-template-columns: 1fr;
      gap: 22px;
    }

    .video-card {
      background: #121212;
      border: 1px solid #252525;
      border-radius: 12px;
      overflow: hidden;
    }

    .video-frame {
      width: 100%;
      aspect-ratio: 9 / 16;
      background: #000;
      position: relative;
      overflow: hidden;
    }

    .video-frame iframe,
    .video-frame video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      background: #000;
      object-fit: contain;
    }

    .video-info {
      padding: 13px;
    }

    .video-title {
      font-size: 16px;
      font-weight: bold;
      line-height: 1.4;
      margin-bottom: 7px;
      overflow-wrap: anywhere;
    }

    .video-description {
      color: #aaa;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 12px;
      overflow-wrap: anywhere;
    }

    .actions {
      display: flex;
      gap: 9px;
    }

    .actions a,
    .actions button {
      flex: 1;
      border: 0;
      border-radius: 7px;
      padding: 11px 8px;
      font-size: 13px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    .watch-btn {
      background: #e50914;
      color: white;
    }

    .download-btn {
      background: #292929;
      color: white;
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin: 25px 0;
    }

    .pagination button {
      background: #202020;
      color: white;
      border: 1px solid #333;
      border-radius: 7px;
      padding: 9px 13px;
      cursor: pointer;
    }

    .pagination button.active {
      background: #e50914;
      border-color: #e50914;
    }

    .pagination button:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .message {
      text-align: center;
      color: #aaa;
      padding: 35px 10px;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      color: #777;
      font-size: 12px;
      padding: 25px 12px;
      border-top: 1px solid #222;
      margin-top: 25px;
    }

    #player {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0,0,0,.96);
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    #player.show {
      display: flex;
    }

    .player-content {
      width: 100%;
      max-width: 480px;
    }

    .player-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 10px;
    }

    #playerTitle {
      font-size: 15px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    #closePlayer {
      background: #e50914;
      color: white;
      border: 0;
      border-radius: 7px;
      padding: 9px 13px;
      font-size: 14px;
      cursor: pointer;
    }

    .player-screen {
      width: 100%;
      aspect-ratio: 9 / 16;
      background: #000;
      position: relative;
      overflow: hidden;
      border-radius: 9px;
    }

    .player-screen iframe,
    .player-screen video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      object-fit: contain;
    }

    @media (min-width: 700px) {
      #videos {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      main {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-inner">
      <div>
        <div class="logo">JZ <span>PLAY</span></div>
        <div class="tagline">Tempat menonton video hiburan</div>
      </div>
    </div>
  </header>

  <main>

    <!-- BANNER ADSTERRA -->
    <div class="ad-box">
      <div id="container-d97c13de15c560f017d5d95845aa3c2b"></div>
      <script
        async="async"
        data-cfasync="false"
        src="https://bancadeltempoidea.org/21/d97c13de15c560f017d5d95845aa3c2b">
      </script>
    </div>

    <!-- BANNER MONETAG -->
    <div class="ad-box">
      <script
        src="https://quge5.com/88/tag.min.js"
        data-zone="305426"
        async
        data-cfasync="false">
      </script>
    </div>

    <div class="search-box">
      <input
        type="search"
        id="searchInput"
        placeholder="Cari video..."
        autocomplete="off">
    </div>

    <h2 class="section-title">Video Terbaru</h2>

    <div id="videos">
      <div class="message">Memuat video...</div>
    </div>

    <div class="pagination" id="pagination"></div>

    <div class="ad-box">
      <!-- Slot iklan tambahan -->
    </div>

  </main>

  <footer>
    © 2026 JZ PLAY. All Rights Reserved.
  </footer>

  <!-- PEMUTAR VIDEO -->
  <div id="player">
    <div class="player-content">
      <div class="player-top">
        <div id="playerTitle">Memutar video</div>
        <button id="closePlayer">Tutup ✕</button>
      </div>
      <div class="player-screen" id="playerScreen"></div>
    </div>
  </div>

  <script>
    // KONFIGURASI SUPABASE
    const SUPABASE_URL =
      "https://hinxtbzzavdnabtukaqw.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_2HTAulFHCy0L7ix7NQvLKw_W0BnuTM-";

    const TABLE = "videos";
    const PER_PAGE = 8;

    let allVideos = [];
    let filteredVideos = [];
    let currentPage = 1;

    const videosContainer = document.getElementById("videos");
    const pagination = document.getElementById("pagination");
    const searchInput = document.getElementById("searchInput");

    function isDirectVideo(url) {
      return /\.(mp4|webm|ogg|m4v)(\?.*)?$/i.test(url || "");
    }

    function createElement(tag, className, text) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      if (text !== undefined) el.textContent = text;
      return el;
    }

    async function loadVideos() {
      try {
        const response = await fetch(
          SUPABASE_URL +
          "/rest/v1/videos?select=*&order=created_at.desc",
          {
            headers: {
              apikey: SUPABASE_KEY,
              Authorization: "Bearer " + SUPABASE_KEY
            }
          }
        );

        if (!response.ok) {
          throw new Error("Gagal mengambil data video.");
        }

        allVideos = await response.json();
        filteredVideos = allVideos;
        renderVideos();

      } catch (error) {
        videosContainer.innerHTML = "";
        videosContainer.appendChild(
          createElement(
            "div",
            "message",
            "Video gagal dimuat. Periksa koneksi atau pengaturan Supabase."
          )
        );
        console.error(error);
      }
    }

    function renderVideos() {
      videosContainer.innerHTML = "";
      pagination.innerHTML = "";

      if (!filteredVideos.length) {
        videosContainer.appendChild(
          createElement("div", "message", "Video tidak ditemukan.")
        );
        return;
      }

      const totalPages = Math.ceil(filteredVideos.length / PER_PAGE);

      if (currentPage > totalPages) {
        currentPage = totalPages;
      }

      const start = (currentPage - 1) * PER_PAGE;
      const pageVideos = filteredVideos.slice(start, start + PER_PAGE);

      pageVideos.forEach(video => {
        const card = createElement("article", "video-card");

        const frame = createElement("div", "video-frame");
        const videoUrl = video.video_url || "";

        if (isDirectVideo(videoUrl)) {
          const videoElement = document.createElement("video");
          videoElement.className = "inline-video";
          videoElement.src = videoUrl;
          videoElement.controls = true;
          videoElement.playsInline = true;
          videoElement.preload = "metadata";
          frame.appendChild(videoElement);
        } else {
          const iframe = document.createElement("iframe");
          iframe.className = "inline-embed";
          iframe.src = videoUrl;
          iframe.loading = "lazy";
          iframe.allowFullscreen = true;
          iframe.setAttribute(
            "allow",
            "autoplay; encrypted-media; picture-in-picture"
          );
          frame.appendChild(iframe);
        }

        const info = createElement("div", "video-info");

        const title = createElement(
          "div",
          "video-title",
          video.title || "Tanpa judul"
        );

        const description = createElement(
          "div",
          "video-description",
          video.description || ""
        );

        const actions = createElement("div", "actions");

        const watchButton = createElement(
          "button",
          "watch-btn",
          "▶ Tonton"
        );

        watchButton.type = "button";
        watchButton.addEventListener("click", () => openVideo(video));

        actions.appendChild(watchButton);

        if (video.download_url) {
          const downloadButton = createElement(
            "a",
            "download-btn",
            "⬇ Download"
          );

          downloadButton.href = video.download_url;
          downloadButton.target = "_blank";
          downloadButton.rel = "noopener noreferrer";
          actions.appendChild(downloadButton);
        }

        info.appendChild(title);

        if (video.description) {
          info.appendChild(description);
        }

        info.appendChild(actions);
        card.appendChild(frame);
        card.appendChild(info);
        videosContainer.appendChild(card);
      });

      renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
      if (totalPages <= 1) return;

      const previous = createElement("button", "", "‹");
      previous.disabled = currentPage === 1;
      previous.addEventListener("click", () => {
        currentPage--;
        renderVideos();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
      pagination.appendChild(previous);

      for (let page = 1; page <= totalPages; page++) {
        const button = createElement("button", "", String(page));

        if (page === currentPage) {
          button.classList.add("active");
        }

        button.addEventListener("click", () => {
          currentPage = page;
          renderVideos();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });

        pagination.appendChild(button);
      }

      const next = createElement("button", "", "›");
      next.disabled = currentPage === totalPages;
      next.addEventListener("click", () => {
        currentPage++;
        renderVideos();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
      pagination.appendChild(next);
    }

    function openVideo(video) {
      const player = document.getElementById("player");
      const screen = document.getElementById("playerScreen");

      document.getElementById("playerTitle").textContent =
        video.title || "Memutar video";

      screen.innerHTML = "";

      if (isDirectVideo(video.video_url)) {
        const videoElement = document.createElement("video");
        videoElement.src = video.video_url;
        videoElement.controls = true;
        videoElement.autoplay = true;
        videoElement.playsInline = true;
        screen.appendChild(videoElement);
      } else {
        const iframe = document.createElement("iframe");
        iframe.src = video.video_url;
        iframe.allowFullscreen = true;
        iframe.allow =
          "autoplay; encrypted-media; picture-in-picture";
        screen.appendChild(iframe);
      }

      player.classList.add("show");
    }

    function closePlayer() {
      document.getElementById("player").classList.remove("show");
      document.getElementById("playerScreen").innerHTML = "";
    }

    document.getElementById("closePlayer")
      .addEventListener("click", closePlayer);

    document.getElementById("player")
      .addEventListener("click", function(event) {
        if (event.target === this) closePlayer();
      });

    searchInput.addEventListener("input", function() {
      const keyword = this.value.toLowerCase().trim();

      filteredVideos = allVideos.filter(video => {
        const title = (video.title || "").toLowerCase();
        const description = (video.description || "").toLowerCase();

        return title.includes(keyword) ||
               description.includes(keyword);
      });

      currentPage = 1;
      renderVideos();
    });

    loadVideos();
  </script>

</body>
  </html>
